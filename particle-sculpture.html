<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粒子雕塑 — 思想者</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #000;
        overflow: hidden;
        cursor: crosshair;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }
    #hint {
        position: fixed;
        bottom: 30px;
        width: 100%;
        text-align: center;
        color: rgba(255,255,255,0.45);
        font-family: 'Georgia', 'Noto Serif SC', serif;
        font-size: 14px;
        pointer-events: none;
        transition: opacity 0.8s;
        letter-spacing: 2px;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">单击凝聚 — 双击释放</div>
<script>
// ============================================================
//  粒子雕塑 — 罗丹《思想者》
//  星云漩涡 → 点击聚拢 → 雕塑成形 → 双击爆炸 → 回归星云
// ============================================================

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hint = document.getElementById('hint');

// ===================== 画布自适应 =====================
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ===================== 常量配置 =====================
const PARTICLE_COUNT = 2000;
const TRAIL_MAX = 8;
const π = Math.PI;

// 状态枚举
const STATE = { VORTEX: 'vortex', CONVERGING: 'converging', SCULPTURE: 'sculpture', EXPLODING: 'exploding' };

// ===================== 游戏全局变量 =====================
let state = STATE.VORTEX;
let stateTimer = 0;        // 当前状态已持续时间
let phaseTimer = 0;        // 子阶段计时
let particles = [];
let sculptureTargets = []; // 相对于雕塑中心的坐标
let sculptureCenter = { x: 0, y: 0 };
let clickPoint = null;
let convergePhase = 0;     // 0=聚拢中 1=簇形成 2=向雕塑展开 3=雕塑完成
let explodePhase = 0;      // 0=爆炸扩散 1=消散淡化 2=完成

// ===================== 预渲染辉光精灵 =====================
function createGlowSprite(color1, color2, size, innerRatio) {
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const g = c.getContext('2d');
    const half = size / 2;
    const grad = g.createRadialGradient(half, half, 0, half, half, half);
    grad.addColorStop(0, color1);
    grad.addColorStop(innerRatio, color2);
    grad.addColorStop(0.7, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, size, half * 2);
    return c;
}

const glowGolden  = createGlowSprite('rgba(255,240,200,1)',   'rgba(255,180,40,0.6)',  24, 0.15);
const glowSilver  = createGlowSprite('rgba(240,240,255,1)',   'rgba(180,190,210,0.5)', 20, 0.12);
const glowStone   = createGlowSprite('rgba(220,210,190,0.9)', 'rgba(140,120,100,0.5)', 16, 0.25);
const glowWhite   = createGlowSprite('rgba(255,255,255,1)',   'rgba(255,255,255,0.7)', 22, 0.18);
const glowCluster = createGlowSprite('rgba(255,255,240,1)',   'rgba(255,200,60,0.8)',  30, 0.1);

// ===================== 雕塑目标生成（离屏Canvas）=====================
function generateSculptureTargets() {
    const w = 400, h = 500;
    const off = document.createElement('canvas');
    off.width = w; off.height = h;
    const g = off.getContext('2d');

    // 纯黑背景
    g.fillStyle = '#000';
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#FFF';

    // ─── 基座（岩石） ───
    g.beginPath();
    g.ellipse(200, 440, 110, 28, 0, 0, π * 2);
    g.fill();
    g.fillRect(90, 425, 220, 30);
    // 基座不规则纹理
    g.fillRect(85, 435, 15, 18);
    g.fillRect(295, 438, 20, 15);
    g.beginPath();
    g.ellipse(200, 425, 105, 22, 0, 0, π);
    g.fill();

    // ─── 左小腿 ───
    g.save();
    g.translate(155, 390);
    g.rotate(0.25);
    g.fillRect(-12, -5, 28, 55);
    g.restore();

    // 左脚
    g.beginPath();
    g.ellipse(165, 435, 16, 8, 0.15, 0, π * 2);
    g.fill();

    // ─── 右小腿 ───
    g.save();
    g.translate(230, 385);
    g.rotate(-0.15);
    g.fillRect(-12, -5, 26, 50);
    g.restore();

    // 右脚
    g.beginPath();
    g.ellipse(240, 432, 15, 8, -0.1, 0, π * 2);
    g.fill();

    // ─── 左大腿（抬高，膝盖在上） ───
    g.save();
    g.translate(160, 355);
    g.rotate(-0.55);
    g.fillRect(-16, -8, 38, 60);
    g.restore();

    // ─── 右大腿 ───
    g.save();
    g.translate(225, 360);
    g.rotate(-0.1);
    g.fillRect(-15, -8, 38, 50);
    g.restore();

    // ─── 躯干（前倾） ───
    g.save();
    g.translate(195, 280);
    g.rotate(-0.18);
    g.beginPath();
    g.ellipse(0, -15, 55, 75, 0, 0, π * 2);
    g.fill();
    g.restore();

    // ─── 肩部 ───
    g.beginPath();
    g.ellipse(188, 210, 62, 30, -0.1, 0, π * 2);
    g.fill();

    // ─── 颈部 ───
    g.fillRect(178, 190, 22, 25);

    // ─── 头部（前倾、低垂）───
    g.save();
    g.translate(183, 160);
    g.rotate(0.35);
    g.beginPath();
    g.ellipse(0, 0, 32, 38, 0, 0, π * 2);
    g.fill();
    g.restore();

    // ─── 左臂（自然下垂）───
    g.save();
    g.translate(145, 235);
    g.rotate(0.4);
    g.fillRect(-11, -5, 24, 65);
    g.restore();

    // ─── 右上臂（从肩膀到左膝）───
    g.save();
    g.translate(210, 225);
    g.rotate(-0.6);
    g.fillRect(-11, -5, 24, 60);
    g.restore();

    // ─── 右前臂（从肘部到下巴）───
    g.save();
    g.translate(185, 195);
    g.rotate(-1.25);
    g.fillRect(-10, -4, 22, 55);
    g.restore();

    // ─── 右手/拳（托腮）───
    g.beginPath();
    g.ellipse(170, 163, 16, 13, 0.35, 0, π * 2);
    g.fill();

    // ─── 背部轮廓加强 ───
    g.save();
    g.translate(220, 250);
    g.rotate(-0.1);
    g.beginPath();
    g.ellipse(0, 0, 35, 55, 0, 0, π * 2);
    g.fill();
    g.restore();

    // ─── 提取白色像素坐标 ───
    const imgData = g.getImageData(0, 0, w, h);
    const pixels = imgData.data;
    const whitePixels = [];

    // 隔行采样以提高效率
    for (let y = 0; y < h; y += 1) {
        for (let x = 0; x < w; x += 1) {
            const idx = (y * w + x) * 4;
            if (pixels[idx] > 128) { // 白色像素
                whitePixels.push({ x: x - w / 2, y: y - h / 2 });
            }
        }
    }

    // 随机打乱并取所需数量
    for (let i = whitePixels.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [whitePixels[i], whitePixels[j]] = [whitePixels[j], whitePixels[i]];
    }

    return whitePixels;
}

// ===================== 粒子系统 =====================
function createParticle() {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const angle = Math.random() * π * 2;
    const dist = 40 + Math.random() * 320;
    const layer = dist < 110 ? 0 : (dist < 210 ? 1 : 2);

    // 暖金 vs 冷银
    const isGold = Math.random() < 0.55;
    const goldHue = 38 + Math.random() * 18;    // 38-56 (warm gold)
    const silverHue = 210 + Math.random() * 20;  // 210-230 (cool silver-blue)
    const hue = isGold ? goldHue : silverHue;
    const sat = isGold ? 70 + Math.random() * 30 : 10 + Math.random() * 25;
    const light = isGold ? 55 + Math.random() * 35 : 60 + Math.random() * 30;

    return {
        x: cx + Math.cos(angle) * dist,
        y: cy + Math.sin(angle) * dist,
        vx: 0, vy: 0,
        baseX: cx + Math.cos(angle) * dist,
        baseY: cy + Math.sin(angle) * dist,
        color: { h: hue, s: sat, l: light },
        isGold: isGold,
        glow: 0.5 + Math.random() * 0.7,  // 自发光强度 0.5-1.2
        size: 1.2 + Math.random() * 1.8,
        layer: layer,
        orbitAngle: angle,
        orbitRadius: dist,
        orbitSpeed: (0.3 + Math.random() * 0.7) * (dist < 110 ? 1.6 : (dist < 210 ? 1.0 : 0.5)),
        trail: [],
        targetX: 0, targetY: 0,
        // 雕塑状态的固定偏移（模拟石材纹理）
        stoneOffsetX: 0, stoneOffsetY: 0,
        brightness: 1.0,
        alpha: 1.0,
    };
}

function initParticles() {
    particles = [];
    for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(createParticle());
    }
}

// ===================== 状态更新 =====================
function updateVortex(dt) {
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    const t = stateTimer;

    for (const p of particles) {
        // 渐入效果（前3秒）
        const fadeIn = Math.min(1, t / 3.0);
        p.alpha = fadeIn;

        // 轨道旋转（逆时针 = 角度递减）
        p.orbitAngle -= p.orbitSpeed * dt * 1.8;
        // 微小径向呼吸
        const breathe = 1 + Math.sin(t * 0.7 + p.orbitAngle) * 0.04;
        const r = p.orbitRadius * breathe;

        const tx = cx + Math.cos(p.orbitAngle) * r;
        const ty = cy + Math.sin(p.orbitAngle) * r;

        // 弹簧式趋向目标（带旋转的轨道位置）
        const fx = (tx - p.x) * 3.5;
        const fy = (ty - p.y) * 3.5;

        // 模拟湍流——使用多频正弦叠加
        const turbX = Math.sin(p.x * 0.008 + t * 1.3) * Math.cos(p.y * 0.011 + t * 0.9) * 60;
        const turbY = Math.cos(p.x * 0.009 + t * 1.1) * Math.sin(p.y * 0.010 + t * 1.2) * 60;

        p.vx += (fx + turbX) * dt;
        p.vy += (fy + turbY) * dt;

        // 弱引力中心
        const dxc = cx - p.x;
        const dyc = cy - p.y;
        const distC = Math.sqrt(dxc * dxc + dyc * dyc) + 1;
        const gravForce = 80 / (distC * 0.3 + 1);
        p.vx += (dxc / distC) * gravForce * dt;
        p.vy += (dyc / distC) * gravForce * dt;

        // 层间分离力
        const idealDist = p.orbitRadius;
        const distFromCenter = Math.sqrt((p.x - cx) ** 2 + (p.y - cy) ** 2) + 1;
        const radialForce = (idealDist - distFromCenter) * 0.8;
        p.vx += ((p.x - cx) / distFromCenter) * radialForce * dt;
        p.vy += ((p.y - cy) / distFromCenter) * radialForce * dt;

        // 阻尼
        p.vx *= 0.96;
        p.vy *= 0.96;

        // 更新位置
        p.x += p.vx * dt;
        p.y += p.vy * dt;

        // 轨迹记录
        const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (spd > 1) {
            p.trail.push({ x: p.x, y: p.y, s: spd });
            if (p.trail.length > TRAIL_MAX) p.trail.shift();
        }

        // 自发光随机微变
        p.glow += (Math.random() - 0.5) * 0.03;
        p.glow = Math.max(0.5, Math.min(1.2, p.glow));

        // 颜色微调
        p.color.l += (Math.random() - 0.5) * 0.5;
        p.color.l = Math.max(40, Math.min(90, p.color.l));
    }
}

function updateConverging(dt) {
    stateTimer += dt;
    const cp = clickPoint;

    if (stateTimer < 0.9) {
        // 阶段0: 急速向点击点汇聚
        convergePhase = 0;
        for (const p of particles) {
            const dx = cp.x - p.x;
            const dy = cp.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
            const force = 1800 / (dist * 0.15 + 1);
            p.vx += (dx / dist) * force * dt;
            p.vy += (dy / dist) * force * dt;
            p.vx *= 0.88;
            p.vy *= 0.88;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            // 热烈金色增强
            p.color.h += (42 - p.color.h) * 0.05;
            p.color.s += (95 - p.color.s) * 0.05;
            p.color.l += (75 - p.color.l) * 0.05;
            p.glow += (1.2 - p.glow) * 0.1;

            // 长拖尾
            const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
            if (spd > 2) {
                p.trail.push({ x: p.x, y: p.y, s: spd });
                if (p.trail.length > TRAIL_MAX + 4) p.trail.shift();
            }
        }
    } else if (stateTimer < 1.4) {
        // 阶段1: 在点击点形成高亮粒子簇，分配雕塑目标
        if (convergePhase === 0) {
            convergePhase = 1;
            // 分配雕塑目标
            sculptureCenter = { x: cp.x, y: cp.y };
            const shuffled = [...sculptureTargets];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            const scale = Math.min(canvas.width, canvas.height) / 500;
            for (let i = 0; i < particles.length; i++) {
                const tgt = shuffled[i % shuffled.length];
                particles[i].targetX = cp.x + tgt.x * scale;
                particles[i].targetY = cp.y + tgt.y * scale;
                particles[i].stoneOffsetX = (Math.random() - 0.5) * 3;
                particles[i].stoneOffsetY = (Math.random() - 0.5) * 3;
            }
        }
        // 粒子在簇中涡旋等待
        for (const p of particles) {
            const dx = cp.x - p.x;
            const dy = cp.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
            const force = 600 / (dist * 0.2 + 1);
            p.vx += (dx / dist) * force * dt;
            p.vy += (dy / dist) * force * dt;
            // 旋转分量
            p.vx += dy * 2 * dt;
            p.vy += -dx * 2 * dt;
            p.vx *= 0.82;
            p.vy *= 0.82;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.glow = 1.2;
        }
    } else if (stateTimer < 2.8) {
        // 阶段2: 粒子从簇向雕塑形态展开
        convergePhase = 2;
        const progress = (stateTimer - 1.4) / 1.4; // 0→1
        const eased = 1 - Math.pow(1 - progress, 3); // easeOut

        for (const p of particles) {
            const tx = p.targetX;
            const ty = p.targetY;
            const force = 4 + eased * 12;
            p.vx += (tx - p.x) * force * dt;
            p.vy += (ty - p.y) * force * dt;
            p.vx *= 0.9;
            p.vy *= 0.9;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            // 颜色过渡到石材
            const stoneH = 35 + Math.random() * 8;
            const stoneS = 5 + Math.random() * 15;
            const stoneL = 35 + Math.random() * 40;
            p.color.h += (stoneH - p.color.h) * 0.04;
            p.color.s += (stoneS - p.color.s) * 0.04;
            p.color.l += (stoneL - p.color.l) * 0.04;
            p.glow += (0.6 - p.glow) * 0.05;

            // 短拖尾
            p.trail = [];
        }
    } else {
        // 雕塑完成
        convergePhase = 3;
        switchToSculpture();
    }
}

function switchToSculpture() {
    state = STATE.SCULPTURE;
    stateTimer = 0;
    for (const p of particles) {
        p.vx = 0; p.vy = 0;
        p.trail = [];
        // 精确到位
        p.x = p.targetX;
        p.y = p.targetY;
        p.glow = 0.45 + Math.random() * 0.3;
        p.brightness = 1.0;
    }
    hint.textContent = '双击任意位置 — 释放粒子';
}

function updateSculpture(dt) {
    stateTimer += dt;

    // 聚光灯参数（从左上方45°照射）
    const lightX = sculptureCenter.x - 500;
    const lightY = sculptureCenter.y - 500;

    for (const p of particles) {
        // 微小呼吸振动
        const breathe = Math.sin(stateTimer * 1.5 + p.stoneOffsetX * 2) * 0.5;
        p.x = p.targetX + p.stoneOffsetX + Math.sin(stateTimer * 1.2 + p.y * 0.01) * 0.6;
        p.y = p.targetY + p.stoneOffsetY + Math.cos(stateTimer * 1.3 + p.x * 0.01) * 0.6 + breathe;

        // 聚光灯计算
        const dxL = p.x - lightX;
        const dyL = p.y - lightY;
        const distL = Math.sqrt(dxL * dxL + dyL * dyL) + 1;
        // 点到光源连线的"光照面"计算
        const dotProduct = (dxL * (p.x - sculptureCenter.x) + dyL * (p.y - sculptureCenter.y)) / (distL * 100 + 1);
        const yNorm = (p.y - (sculptureCenter.y - 250)) / 500; // 0=顶部 1=底部
        const brightness = 0.35 + 0.65 * Math.max(0, (1 - yNorm * 1.2) + dotProduct * 0.3);
        p.brightness = brightness;

        // 石材色温
        const baseL = 25 + brightness * 45;
        p.color.l += (baseL - p.color.l) * 0.1;
        p.color.s = 8 + brightness * 18;
        p.glow = 0.25 + brightness * 0.35;
        p.alpha = 1;
    }
}

function updateExploding(dt) {
    stateTimer += dt;

    if (stateTimer < 0.7) {
        // 阶段0: 爆炸扩散
        explodePhase = 0;
        const force = 800 * (1 - stateTimer / 0.7) + 200;
        for (const p of particles) {
            const dx = p.x - sculptureCenter.x;
            const dy = p.y - sculptureCenter.y;
            const dist = Math.sqrt(dx * dx + dy * dy) + 0.1;
            p.vx += (dx / dist) * force * dt;
            p.vy += (dy / dist) * force * dt;
            // 额外随机分量
            p.vx += (Math.random() - 0.5) * force * 1.5 * dt;
            p.vy += (Math.random() - 0.5) * force * 1.5 * dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;

            // 颜色从石材过渡到亮白
            p.color.h += (45 - p.color.h) * 0.03;
            p.color.s += (30 - p.color.s) * 0.03;
            p.color.l += (92 - p.color.l) * 0.04;
            p.glow = 1.2;

            // 长模糊拖尾
            const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
            if (spd > 5) {
                p.trail.push({ x: p.x, y: p.y, s: spd });
                if (p.trail.length > TRAIL_MAX + 6) p.trail.shift();
            }
        }
    } else if (stateTimer < 2.0) {
        // 阶段1: 消散淡化
        explodePhase = 1;
        for (const p of particles) {
            p.vx *= 0.96;
            p.vy *= 0.96;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.alpha = Math.max(0, 1 - (stateTimer - 0.7) / 1.3);
            p.color.l = 95;
            p.color.s = 5;
            p.glow = 1.2 * p.alpha;
        }
    } else {
        // 阶段2: 重置为星云漩涡
        explodePhase = 2;
        resetToVortex();
    }
}

function resetToVortex() {
    state = STATE.VORTEX;
    stateTimer = 0;
    clickPoint = null;
    initParticles();
    hint.textContent = '单击凝聚 — 双击释放';
}

// ===================== 渲染 =====================
function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 纯黑背景
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (const p of particles) {
        if (p.alpha <= 0.01) continue;
        const alpha = Math.min(1, p.alpha);

        // ─── 拖尾渲染 ───
        if (p.trail.length > 1) {
            for (let i = 1; i < p.trail.length; i++) {
                const t0 = p.trail[i - 1];
                const t1 = p.trail[i];
                const trailAlpha = (i / p.trail.length) * alpha * 0.6;
                const trailWidth = 0.5 + (t1.s / 200) * 3;
                ctx.strokeStyle = `hsla(${p.color.h},${p.color.s}%,${p.color.l}%,${trailAlpha})`;
                ctx.lineWidth = trailWidth;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(t0.x, t0.y);
                ctx.lineTo(t1.x, t1.y);
                ctx.stroke();
            }
        }

        // ─── 辉光渲染 ───
        const glowAlpha = p.glow * alpha;
        ctx.globalAlpha = glowAlpha;

        let sprite;
        if (state === STATE.SCULPTURE) {
            sprite = glowStone;
        } else if (state === STATE.CONVERGING && convergePhase === 1) {
            sprite = glowCluster;
        } else if (state === STATE.EXPLODING && explodePhase >= 1) {
            sprite = glowWhite;
        } else if (p.isGold) {
            sprite = glowGolden;
        } else {
            sprite = glowSilver;
        }

        const spriteSize = sprite.width * (0.7 + p.glow * 0.6);
        ctx.drawImage(sprite, p.x - spriteSize / 2, p.y - spriteSize / 2, spriteSize, spriteSize);

        // ─── 核心亮点 ───
        ctx.globalAlpha = alpha;
        ctx.fillStyle = `hsl(${p.color.h},${p.color.s}%,${Math.min(100, p.color.l + 20)}%)`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 0.4, 0, π * 2);
        ctx.fill();

        ctx.globalAlpha = 1;
    }

    // ─── 雕塑状态聚光灯提示 ───
    if (state === STATE.SCULPTURE) {
        const sc = sculptureCenter;
        const grad = ctx.createRadialGradient(sc.x - 60, sc.y - 200, 50, sc.x, sc.y + 180, 400);
        grad.addColorStop(0, 'rgba(255,250,240,0.06)');
        grad.addColorStop(0.5, 'rgba(255,240,220,0.03)');
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

// ===================== 输入处理 =====================
let lastClickTime = 0;
let clickTimeout = null;

canvas.addEventListener('click', (e) => {
    const now = Date.now();
    const dt = now - lastClickTime;

    if (dt < 350 && state === STATE.SCULPTURE) {
        // 双击 → 爆炸
        clearTimeout(clickTimeout);
        lastClickTime = 0;
        triggerExplode(e.clientX, e.clientY);
        return;
    }

    lastClickTime = now;
    if (clickTimeout) clearTimeout(clickTimeout);
    clickTimeout = setTimeout(() => {
        // 确认是单击
        if (state === STATE.VORTEX) {
            triggerConverge(e.clientX, e.clientY);
        }
        lastClickTime = 0;
    }, 360);
});

// 触摸支持
let lastTouchTime = 0;
let touchTimeout = null;

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const now = Date.now();
    const dt = now - lastTouchTime;

    if (dt < 350 && state === STATE.SCULPTURE) {
        clearTimeout(touchTimeout);
        lastTouchTime = 0;
        const t = e.touches[0];
        triggerExplode(t.clientX, t.clientY);
        return;
    }

    lastTouchTime = now;
    if (touchTimeout) clearTimeout(touchTimeout);
    touchTimeout = setTimeout(() => {
        if (state === STATE.VORTEX) {
            const t = e.touches[0] || e.changedTouches[0];
            if (t) triggerConverge(t.clientX, t.clientY);
        }
        lastTouchTime = 0;
    }, 360);
}, { passive: false });

function triggerConverge(x, y) {
    clickPoint = { x, y };
    // 限制雕塑不会出屏
    const margin = 120;
    clickPoint.x = Math.max(margin, Math.min(canvas.width - margin, clickPoint.x));
    clickPoint.y = Math.max(margin + 100, Math.min(canvas.height - margin, clickPoint.y));

    state = STATE.CONVERGING;
    stateTimer = 0;
    convergePhase = 0;
    hint.textContent = '粒子凝聚中…';
}

function triggerExplode(x, y) {
    sculptureCenter = { x, y };
    // 限制在有效范围
    sculptureCenter.x = Math.max(100, Math.min(canvas.width - 100, sculptureCenter.x));
    sculptureCenter.y = Math.max(100, Math.min(canvas.height - 100, sculptureCenter.y));

    state = STATE.EXPLODING;
    stateTimer = 0;
    explodePhase = 0;
    hint.textContent = '粒子释放中…';
}

// ===================== 主循环 =====================
let lastTime = 0;
function gameLoop(ts) {
    if (lastTime === 0) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    lastTime = ts;
    if (dt > 0.1) dt = 0.1;

    switch (state) {
        case STATE.VORTEX:
            stateTimer += dt;
            updateVortex(dt);
            break;
        case STATE.CONVERGING:
            updateConverging(dt);
            break;
        case STATE.SCULPTURE:
            updateSculpture(dt);
            break;
        case STATE.EXPLODING:
            updateExploding(dt);
            break;
    }

    render();
    requestAnimationFrame(gameLoop);
}

// ===================== 初始化 =====================
sculptureTargets = generateSculptureTargets();
initParticles();
resize();
requestAnimationFrame(gameLoop);

// 窗口大小变化时重置
window.addEventListener('resize', () => {
    resize();
    if (state === STATE.VORTEX) {
        initParticles();
        stateTimer = 0;
    }
});

console.log('%c🧬 粒子雕塑已就绪 %c| %c单击凝聚 %c→ %c思想者 %c| %c双击释放 %c→ %c星云',
    'color:#FFD700;font-size:16px;', '',
    'color:#FFD700;', '', 'color:#C0C0C0;', '',
    'color:#FFD700;', '', 'color:#C0C0C0;');
</script>
